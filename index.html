    <noscript>
      <h1>EDID Editor</h1>
      <p>Builds an EDID from a resolution and a refresh rate, or lets you edit every field of one by hand, all in the browser. Then it does the bit that usually costs an afternoon: it works out the smallest HDMI or DisplayPort version that carries the mode, and checks it against twenty-three models of event processor, answering yes, no, or which input capacity mode you'd have to go and set up first.</p>
      <p>It needs JavaScript to run.</p>
